<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive 시각자료 색인</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --accent-soft: #e8efff; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --panel: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
            --accent: #6d9bff; --accent-soft: #1e2a44; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  h1 { font-size: 17px; margin: 0 12px 0 0; }
  input[type=text] { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
                     background: var(--bg); color: var(--text); font-size: 15px; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
           color: var(--text); cursor: pointer; font-size: 14px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; cursor: pointer;
          background: var(--panel); color: var(--muted); }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .status { font-size: 13px; color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: 1; min-width: 120px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
          cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .card:hover { border-color: var(--accent); }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; background: var(--bg); display: block; }
  .card .meta { padding: 8px 10px; font-size: 13px; display: grid; gap: 3px; }
  .card .file { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag.sem { background: transparent; border: 1px dashed var(--accent); }
  .tag.ai { background: #f59e0b; color: #1d2330; }
  #aiBtn.on { background: #f59e0b; color: #1d2330; border-color: #f59e0b; }
  .concepts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #keybar button { padding: 3px 10px; font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft);
         color: var(--accent); margin-right: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; }
  /* viewer */
  /* 보기 화면: 그림을 화면 가득, 위쪽 얇은 막대에 넘기기·원본 열기만 */
  .viewer { position: fixed; inset: 0; background: #111; z-index: 20; display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .vbar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #000; }
  .vbar button, .vbar .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #333; background: #1d1f23;
                             color: #eee; font-size: 15px; text-decoration: none; white-space: nowrap; }
  .vbar .btn[hidden] { display: none; }
  .vinfo { flex: 1; min-width: 0; color: #aaa; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .stage { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; display: block; }
  .side { position: absolute; right: 0; top: 50px; bottom: 0; width: min(380px, 92vw); background: var(--panel);
          overflow: auto; padding: 16px; display: grid; gap: 12px; align-content: start; box-shadow: -4px 0 20px rgba(0,0,0,.5); }
  .side[hidden] { display: none; }
  /* 그림 양옆의 큰 넘기기 버튼 (태블릿에서 누르기 쉽게) */
  .edge { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 96px; border: 0; border-radius: 12px;
          background: rgba(0,0,0,.35); color: #fff; font-size: 44px; line-height: 1; cursor: pointer; }
  .edge.left { left: 6px; } .edge.right { right: 6px; }
  .edge:active { background: rgba(0,0,0,.6); }
  .side h2 { font-size: 16px; margin: 0; word-break: break-all; }
  .item { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
  .item .desc { color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
  .kw { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .timing { font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <div class="row" id="adminRow">
    <h1>📁 Drive 시각자료 색인</h1>
    <input id="folder" type="text" placeholder="Drive 폴더 URL, 또는 내 PC 폴더 경로 (예: G:\내 드라이브\건축시공기술사)">
    <button id="btnIndex" class="primary">색인 시작</button>
    <button id="btnExport" title=".env의 EXPORT_DIR(NAS 폴더)로 보기 전용 사이트를 내보냅니다">NAS로 내보내기</button>
  </div>
  <div class="row">
    <div class="bar"><div id="bar"></div></div>
    <span class="status" id="status">불러오는 중…</span>
  </div>
  <div class="row">
    <input id="q" type="text" placeholder="검색: 예) 기온에 따른 강도, 타설 스피드, jsp, 필기한 단어">
    <button id="aiBtn" hidden title="상위 결과를 AI가 질문의 뜻에 맞게 다시 골라 줌 (검색 1번에 약 1원)">🎯 AI 정밀 검색: 끔</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="status" id="keybar" hidden></div>
</header>
<main>
  <div class="status" id="count" style="margin:0 0 10px"></div>
  <div class="grid" id="grid"></div>
  <button id="more" hidden style="display:block;margin:16px auto">더 보기</button>
  <div class="empty" id="empty" hidden>결과가 없습니다.</div>
</main>

<div class="viewer" id="viewer">
  <div class="vbar">
    <button id="prev" title="이전 (←)">← 이전</button><button id="next" title="다음 (→)">다음 →</button>
    <span class="vinfo" id="vsub"></span>
    <a id="vorig" class="btn" target="_blank" rel="noopener">원본 열기 ↗</a>
    <button id="vinfoBtn" title="AI 설명 보기">ⓘ</button>
    <button id="close" title="닫기 (Esc)">✕</button>
  </div>
  <div class="stage" id="stage"><img id="vimg" alt=""></div>
  <button class="edge left" id="prev2" aria-label="이전 그림">‹</button>
  <button class="edge right" id="next2" aria-label="다음 그림">›</button>
  <aside class="side" id="side" hidden>
    <h2 id="vtitle"></h2>
    <div class="timing" id="vtime"></div>
    <div id="vitems"></div>
  </aside>
</div>

<script>
const STATIC_MODE = false;   // 내보내기(NAS) 버전에서는 true 로 바뀜 → 서버 없이 브라우저에서 검색
const KINDS = { "": "전체", figure: "그림", table: "표", flowchart: "플로우차트", chart: "차트",
                diagram: "다이어그램", photo: "사진", screenshot: "스크린샷", handwriting: "필기" };
const $ = id => document.getElementById(id);
let state = { q: "", kind: "", results: [], cur: -1, byKind: {} };
const prefetched = new Set();

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderChips() {
  const total = Object.values(state.byKind).reduce((a, b) => a + b, 0);
  $("chips").innerHTML = Object.entries(KINDS).map(([k, label]) => {
    const n = k ? (state.byKind[k] || 0) : total;
    if (k && !n) return "";
    return `<span class="chip ${state.kind === k ? "on" : ""}" data-k="${k}">${label} ${n}</span>`;
  }).join("");
}
$("chips").onclick = e => { const k = e.target.dataset.k; if (k === undefined) return; state.kind = k; renderChips(); search(); };

let timer, seq = 0;
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(() => { state.q = $("q").value.trim(); search(); }, 150); };

const PAGE_CHUNK = 120;          // 결과 카드는 120개씩 나눠 그림 → 결과가 수천 개여도 바로 뜸
const imgUrl = (dir, p) => `img/${dir}/${p.page_key}.webp?v=${p.v || ""}`;
function cardHtml(p, i) {
  const first = p.items[0] || {};
  const tags = [...new Set(p.items.map(it => KINDS[it.kind] || it.kind))].map(t => `<span class="tag">${esc(t)}</span>`).join("")
    + (p._sem ? `<span class="tag sem" title="단어는 다르지만 뜻이 비슷한 결과">뜻 비슷</span>` : "")
    + (p._ai ? `<span class="tag ai" title="AI가 질문의 뜻에 맞다고 고른 결과">AI 추천</span>` : "");
  return `<div class="card" data-i="${i}">
    <img loading="lazy" src="${imgUrl("thumbs", p)}" alt="">
    <div class="meta"><div>${tags}</div>
      <div class="title">${esc(first.title || first.description || "")}</div>
      <div class="file">${esc(p.file_name)} · ${p.page_no}p</div></div></div>`;
}
let shown = 0;
function renderMore() {
  const next = state.results.slice(shown, shown + PAGE_CHUNK);
  $("grid").insertAdjacentHTML("beforeend", next.map((p, k) => cardHtml(p, shown + k)).join(""));
  shown += next.length;
  $("more").hidden = shown >= state.results.length;
  $("more").textContent = `더 보기 (${state.results.length - shown}개 남음)`;
}
function search() {
  const my = ++seq;
  if (!DATA) return;
  showResults(rank(state.q, state.kind, null));          // 1) 글자·동의어 검색 → 즉시 표시
  clearTimeout(semTimer);
  if (!state.q || (!EMB && !aiOn())) return;
  semTimer = setTimeout(async () => {                     // 입력이 멈추면
    let res = null;
    if (EMB) {                                            // 2) 의미 검색을 더해 다시 정렬
      const qv = await queryVector(state.q);
      if (my !== seq) return;
      if (qv) { res = rank(state.q, state.kind, qv); showResults(res); }
    }
    if (aiOn()) {                                         // 3) AI 정밀 검색: 상위 후보를 AI가 뜻에 맞게 다시 고름
      const rr = await aiRerank(state.q, res || rank(state.q, state.kind, null), my);
      if (rr && my === seq) showResults(rr);
    }
  }, 600);
}
let weakShown = false, lastAll = [];
function showResults(results, keepWeak) {
  lastAll = results;
  if (!keepWeak) weakShown = false;
  const strong = results.filter(p => !p._weak), weak = results.length - strong.length;
  state.results = weakShown ? results : strong;
  $("empty").hidden = results.length > 0;
  const sem = state.results.filter(p => p._sem).length, ai = results.filter(p => p._ai).length;
  $("count").innerHTML = !state.q ? (results.length ? `전체 ${results.length}쪽` : "") : results.length
    ? (ai ? `🎯 AI가 고른 결과 ${ai}쪽` : `관련 높은 결과 ${strong.length}쪽${sem ? ` (뜻이 비슷한 결과 ${sem}쪽 포함)` : ""}`)
      + (weak ? ` · <a href="#" id="weakLink">${weakShown ? "관련도 낮은 결과 숨기기" : `관련도 낮은 결과 ${weak}쪽 더 보기`}</a>` : "")
    : "";
  const wl = document.getElementById("weakLink");
  if (wl) wl.onclick = e => { e.preventDefault(); weakShown = !weakShown; showResults(lastAll, true); };
  $("grid").innerHTML = ""; shown = 0;
  renderMore();
}
let semTimer;

// 스크롤이 끝에 가까워지면 자동으로 다음 묶음을 그림
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < state.results.length) renderMore(); },
                         { rootMargin: "800px" }).observe($("more"));
$("more").onclick = renderMore;

// 마우스를 올리면 전체 페이지 이미지를 미리 받아둠 → 클릭 시 즉시 표시
function prefetch(i) {
  const p = state.results[i]; if (!p || prefetched.has(p.page_key)) return;
  prefetched.add(p.page_key); const im = new Image(); im.src = imgUrl("pages", p);
}
$("grid").addEventListener("mouseover", e => { const c = e.target.closest(".card"); if (c) prefetch(+c.dataset.i); });
$("grid").addEventListener("touchstart", e => { const c = e.target.closest(".card"); if (c) prefetch(+c.dataset.i); }, { passive: true });
$("grid").onclick = e => { const c = e.target.closest(".card"); if (c) openViewer(+c.dataset.i); };

function openViewer(i) {
  const p = state.results[i]; if (!p) return;
  state.cur = i;
  const t0 = performance.now();
  const img = $("vimg");
  img.src = imgUrl("thumbs", p);                       // 캐시된 썸네일을 먼저 보여주고
  const full = new Image();
  full.onload = () => { if (state.cur === i) { img.src = full.src;
    $("vtime").textContent = `페이지 표시: ${((performance.now() - t0) / 1000).toFixed(2)}초`; } };
  full.src = imgUrl("pages", p);                       // 고해상도로 교체
  $("vtitle").textContent = p.file_name;
  $("vsub").textContent = `${p.file_name} · ${p.page_no} / ${p.page_count}쪽`;
  // 원본 열기: NAS(또는 PC)에 복사된 원본 PDF를 해당 쪽으로. 없으면 Google Drive 링크
  const o = $("vorig"), base = STATIC_MODE ? "files/" : "/files/";
  if (p.orig) {
    const url = base + p.orig;
    o.href = /\.pdf$/i.test(p.orig)
      ? `pdf.html?${new URLSearchParams({ src: url, page: p.page_no, name: p.file_name })}` : url;
    o.hidden = false;
  } else if (p.web_link) { o.href = p.web_link; o.hidden = false; }
  else o.hidden = true;
  $("vitems").innerHTML = (p.summary ? `<div class="item"><b>📌 ${esc(p.summary)}</b>
       <div class="concepts">${(p.concepts || []).map(c => `<span class="tag">${esc(c)}</span>`).join("")}</div>
       ${(p.questions || []).map(q => `<div class="kw">❓ ${esc(q)}</div>`).join("")}</div>` : "")
    + p.items.map(it => `<div class="item"><span class="tag">${esc(KINDS[it.kind] || it.kind)}</span>
     <b>${esc(it.title)}</b><div class="desc">${esc(it.description)}</div>
     ${it.keywords ? `<div class="kw"># ${esc(it.keywords)}</div>` : ""}
     <div class="kw">분석: ${esc(it.source)}</div></div>`).join("");
  $("viewer").classList.add("open");
  $("stage").scrollTop = 0;
  prefetch(i + 1); prefetch(i - 1);
}
function closeViewer() { $("viewer").classList.remove("open"); state.cur = -1; }
$("close").onclick = closeViewer;
$("prev").onclick = () => openViewer(state.cur - 1);
$("next").onclick = () => openViewer(state.cur + 1);
$("prev2").onclick = () => openViewer(state.cur - 1);
$("next2").onclick = () => openViewer(state.cur + 1);
$("vinfoBtn").onclick = () => { $("side").hidden = !$("side").hidden; };
// 손가락으로 밀어서 이전/다음 (확대한 상태에서는 넘기지 않음)
let tx = 0, ty = 0;
$("stage").addEventListener("touchstart", e => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
$("stage").addEventListener("touchend", e => {
  if ((window.visualViewport && visualViewport.scale > 1.05) || !e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) openViewer(state.cur + (dx < 0 ? 1 : -1));
}, { passive: true });
document.onkeydown = e => {
  if (state.cur < 0) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") openViewer(state.cur + 1);
  if (e.key === "ArrowLeft") openViewer(state.cur - 1);
};

$("btnIndex").onclick = async () => {
  const folder = $("folder").value.trim(); if (!folder) return $("folder").focus();
  const r = await fetch("/api/index", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ folder }) });
  if (!r.ok) alert((await r.json()).detail || "실패");
  poll();
};

let wasRunning = false, folderTouched = false, lastItems = -1, lastRefresh = 0;
$("folder").addEventListener("input", () => { folderTouched = true; });
async function poll() {
  const s = await fetch("/api/status").then(r => r.json());
  const j = s.job, st = s.stats;
  if (!DATA) { state.byKind = st.by_kind || {}; renderChips(); }
  // 마지막으로 색인한 폴더 → 없으면 기본 폴더(.env의 DEFAULT_FOLDER). 칸에서 자유롭게 바꿀 수 있음
  if (!$("folder").value && !folderTouched) $("folder").value = s.folder_id || s.default_folder || "";
  const ai = s.gemini || s.openai ? `AI: ${s.vision_provider} (Gemini ${s.gemini ? "✓" : "✗"} / OpenAI ${s.openai ? "✓" : "✗"})` : "AI 키 없음 → 로컬 분석만";
  let msg = `${s.folder_name ? "📂 " + s.folder_name + " · " : ""}파일 ${st.files} · 시각자료 페이지 ${st.pages} · 항목 ${st.items} · ${ai}`;
  if (j.running) {
    const pct = j.total ? Math.round(j.done / j.total * 100) : 0;
    $("bar").style.width = pct + "%";
    const c = j.ai_calls || {};
    msg = `${j.phase} ${j.done}/${j.total} (${pct}%) · 변경없음 생략 ${j.skipped} · Gemini ${c.gemini || 0} / OpenAI ${c.openai || 0} / 캐시 ${c.cache || 0} · ${j.current || ""}${j.page ? ` (${j.page}${j.pages ? "/" + j.pages : ""}쪽)` : ""}`;
    $("btnIndex").disabled = true;
  } else {
    $("bar").style.width = j.phase ? "100%" : "0";
    $("btnIndex").disabled = false;
    if (j.enrich && j.enrich.pages)
      msg += ` · 개념 정리 ${j.enrich.pages}쪽 (AI 토큰 입력 ${j.enrich.in.toLocaleString()} / 출력 ${j.enrich.out.toLocaleString()})`;
    if (j.skipped_office) msg += ` · 엑셀/워드/PPT ${j.skipped_office}개 건너뜀 (LibreOffice 설치 시 색인)`;
    if (j.incomplete) msg += ` · AI 미완료 파일 ${j.incomplete}개 (한도 도달) → 나중에 "색인 시작"을 다시 누르면 이어서 분석`;
    if (j.errors && j.errors.length) msg += ` · 오류 ${j.errors.length}건: ${j.errors.slice(-1)[0]}`;
  }
  if (j.ai_error) msg += ` · ⚠️ ${j.ai_error}`;
  $("status").textContent = msg;
  // 진행 중에도 결과가 채워지도록 가끔 새로 고침 — 단, 보고 있는 화면(스크롤·뷰어)은 건드리지 않음
  const changed = st.items !== lastItems, idle = window.scrollY < 300 && state.cur < 0;
  if ((j.running && changed && idle && Date.now() - lastRefresh > 20000) || (wasRunning && !j.running)) {
    lastItems = st.items; lastRefresh = Date.now(); loadAll();
  }
  wasRunning = j.running;
  if (j.running) setTimeout(poll, 1500);
}
$("btnExport").onclick = async () => {
  const r = await fetch("/api/export", { method: "POST" });
  const j = await r.json();
  alert(r.ok ? `내보내기 완료: ${j.dir}\n페이지 ${j.pages}개` : (j.detail || "실패"));
};

// ── 검색 엔진 (PC·태블릿 공용) ─────────────────────────────────────────────
// 1) 띄어쓰기·기호 무시  2) 동의어 사전(약어·영어·외래어)  3) 일부 단어만 맞아도 관련도 순
// 4) 의미 검색: 단어가 달라도 뜻이 비슷하면 찾음 (Gemini 임베딩)
let DATA = null, TEXT = {}, THES = new Map(), EMB = null, EMB_DIM = 0;
const norm = s => String(s || "").toLowerCase().replace(/[\s\-_·.,\/()\[\]{}:;'"!?~]+/g, "");

function expandData(raw) {
  if (!raw.files) return raw;
  const pages = raw.pages.map(([k, fi, n, its]) => {
    const [name, path, link, count, v, orig] = raw.files[fi];
    return { page_key: k, file_name: name, path, web_link: link, page_count: count, page_no: n, v, orig: orig || "",
             items: its.map(([kind, title, d, src]) => ({ kind, title, description: d, keywords: "", source: src })) };
  });
  return { meta: raw.meta, pages };
}
function mergeText(T) {
  for (const p of DATA.pages) {
    const e = T[p.page_key]; if (!e) continue;
    const [body, details, summary, concepts, questions] = Array.isArray(e) ? e : [e, []];
    TEXT[p.page_key] = body || "";
    p.summary = summary || ""; p.concepts = concepts || []; p.questions = questions || [];
    p.items.forEach((it, i) => {
      const [desc, kw] = details[i] || [];
      if (desc) it.description = desc;
      if (kw) it.keywords = kw;
    });
  }
}
function buildThes(groups) {
  THES = new Map();
  for (const g of groups) {
    const alts = [...new Set(g.map(norm).filter(Boolean))];
    for (const a of alts) {
      const cur = THES.get(a) || new Set();
      alts.forEach(x => cur.add(x)); THES.set(a, cur);
    }
  }
}
function prepare() {       // 페이지마다 검색용 글을 미리 만들어 둠
  for (const p of DATA.pages) {
    // ① AI가 정리한 요약·핵심 개념은 제목급(가장 중요한 단서)으로, 질문은 본문급으로 반영
    const head = p.items.map(it => `${it.title} ${it.keywords}`).join(" ") + ` ${p.summary || ""} ${(p.concepts || []).join(" ")}`;
    const all = `${p.file_name} ${head} ${p.items.map(it => `${KINDS[it.kind] || ""} ${it.description}`).join(" ")} ${(p.questions || []).join(" ")} ${TEXT[p.page_key] || ""}`;
    p.hayN = norm(all); p.hayS = all.toLowerCase(); p.headN = norm(head);
  }
}
// 검색어를 '단위'로 나눔: 동의어 사전에 있는 말은 최대한 길게 묶고(예: 타설속도), 나머지는 그대로
// 검색어에서 뺄 연결어, 떼어 낼 조사 ("기온에 따른 강도" → 기온, 강도)
const STOPQ = new Set(["따른", "따라", "대한", "대하여", "관한", "관련", "위한", "의한", "통한", "및", "또는", "그리고", "등", "등의", "의", "에", "와", "과", "시", "때"]);
const JOSAQ = ["에서는", "으로는", "에서", "으로", "에는", "에게", "까지", "부터", "보다", "이란", "란", "은", "는", "이", "가", "을", "를", "의", "에", "로", "와", "과", "도"];
function cleanTok(t) {
  if (STOPQ.has(t)) return "";
  if (/[가-힣]$/.test(t) && !THES.has(norm(t)))
    for (const j of JOSAQ) if (t.endsWith(j) && t.length - j.length >= 2) return t.slice(0, -j.length);
  return t;
}
function parseQuery(q) {
  const toks = q.toLowerCase().split(/\s+/).map(cleanTok).filter(Boolean), units = [];
  const unit = t => ({ text: t, alts: THES.has(t) ? [...THES.get(t)] : [t] });
  for (let i = 0; i < toks.length;) {
    let took = 0;
    for (let L = Math.min(5, toks.length - i); L >= 2; L--) {           // 여러 단어 묶음 (jumbo special pile)
      const c = norm(toks.slice(i, i + L).join(""));
      if (THES.has(c)) { units.push(unit(c)); took = L; break; }
    }
    if (took) { i += took; continue; }
    const t = norm(toks[i]); let buf = "";
    for (let pos = 0; pos < t.length;) {                                // 붙여 쓴 말 나누기 (타설적정속도)
      let L = 0;
      for (let l = Math.min(20, t.length - pos); l >= 2; l--) if (THES.has(t.substr(pos, l))) { L = l; break; }
      if (L) {
        if (buf) { units.push(unit(buf)); buf = ""; }
        units.push(unit(t.substr(pos, L))); pos += L;
      } else { buf += t[pos]; pos++; }
    }
    if (buf) units.push(unit(buf));
    i++;
  }
  return units.filter(u => u.text);
}
const reCache = new Map();
function has(p, alt) {
  if (/^[a-z0-9]{1,4}$/.test(alt)) {        // 짧은 영문 약어는 단어 단위로 (rate가 separate에 걸리지 않게)
    let re = reCache.get(alt);
    if (!re) { re = new RegExp(`(^|[^a-z0-9])${alt}([^a-z0-9]|$)`); reCache.set(alt, re); }
    return re.test(p.hayS);
  }
  return p.hayN.includes(alt);
}
function rank(q, kind, qv) {
  let pages = DATA.pages;
  if (kind) pages = pages.filter(p => p.items.some(it => it.kind === kind));
  const view = p => kind ? { ...p, items: p.items.filter(it => it.kind === kind) } : p;
  if (!q) return pages.map(view);
  const units = parseQuery(q);
  if (!units.length) return pages.map(view);
  // 1) 단위마다 어느 페이지에 있는지 (2=입력 그대로, 1=동의어)와 처음 나온 위치
  const pos = (p, u) => { let best = -1;
    for (const a of u.alts) { if (/^[a-z0-9]{1,4}$/.test(a) && !has(p, a)) continue;
      const i = p.hayN.indexOf(a); if (i >= 0 && (best < 0 || i < best)) best = i; } return best; };
  const hits = pages.map(p => units.map(u => has(p, u.text) ? 2 : (u.alts.some(a => a !== u.text && has(p, a)) ? 1 : 0)));
  const N = pages.length;
  const w = units.map((u, k) => Math.log(1 + N / (1 + hits.reduce((n, h) => n + (h[k] ? 1 : 0), 0))));
  const W = w.reduce((a, b) => a + b, 0) || 1;
  // 2) 의미 유사도 (단어가 달라도 뜻이 가까운 정도)
  let sims = null, simCut = 1;
  if (qv && EMB) {
    const idx = new Map(DATA.pages.map((p, i) => [p.page_key, i]));
    sims = pages.map(p => { const o = idx.get(p.page_key) * EMB_DIM; let d = 0;
      for (let j = 0; j < EMB_DIM; j++) d += EMB[o + j] * qv[j]; return d / 127; });
    const sorted = [...sims].sort((a, b) => b - a);
    simCut = Math.max(0.5, (sorted[0] || 0) - 0.15, sorted[Math.min(59, sorted.length - 1)] || 0);
  }
  const out = [];
  pages.forEach((p, i) => {
    const h = hits[i];
    const cov = h.reduce((a, x, k) => a + (x ? w[k] * (x === 2 ? 1 : 0.85) : 0), 0) / W;
    const sim = sims ? Math.max(0, sims[i]) : 0;
    const all = h.every(x => x > 0);
    const lexOk = units.length === 1 ? h[0] > 0 : cov >= 0.5;
    if (!lexOk && !(sims && sims[i] >= simCut)) return;
    // 문맥: 핵심어들이 가까이 붙어 나오면(같은 문장·제목) 가산
    let prox = 0;
    if (all && units.length > 1) {
      const ps = units.map(u => pos(p, u)).filter(x => x >= 0);
      const span = Math.max(...ps) - Math.min(...ps);
      prox = span <= 25 ? 0.35 : span <= 80 ? 0.2 : span <= 250 ? 0.08 : 0;
    }
    const head = units.some(u => p.headN.includes(u.text)) ? 0.1 : 0;
    const lex = lexOk ? cov + prox + head + (all ? 0.15 : 0) : 0;
    out.push({ ...view(p), _lex: lex, _simv: sim, _sem: !lexOk, _i: i });
  });
  // 3) 최종 점수: 글자 맞음(+가까움)과 뜻의 가까움을 반반 → 문맥이 맞는 페이지가 위로
  const maxL = Math.max(0.0001, ...out.map(r => r._lex)), maxS = Math.max(0.0001, ...out.map(r => r._simv));
  // (뜻이 아주 가까우면 단어가 달라도 위로: 의미 점수만으로도 높은 자리에 올 수 있게)
  out.forEach(r => { r._score = sims ? Math.max(0.5 * r._lex / maxL + 0.5 * r._simv / maxS, 0.8 * r._simv / maxS)
                                     : r._lex / maxL; });
  out.sort((a, b) => b._score - a._score || a._i - b._i);
  // 4) 관련도가 확 떨어지는 지점 아래는 '관련도 낮은 결과'로 접어 둠
  const top = out.length ? out[0]._score : 0;
  // 의미 검색이 없으면 글자 점수뿐이라 기준을 더 엄격하게 (핵심어가 가까이 붙은 페이지만 '관련 높음')
  const cut = sims ? 0.55 : 0.8;
  out.forEach(r => { r._weak = r._score < top * cut; });
  return out;
}
// 의미 검색용 검색어 벡터: PC는 서버가, 태블릿은 그 기기에 저장한 키로 Gemini에 직접 요청
const qvCache = new Map();
async function queryVector(q) {
  if (qvCache.has(q)) return qvCache.get(q);
  const m = DATA.meta.embed; let v = null;
  try {
    if (m.query) {
      const r = await fetch(`${m.query}?q=${encodeURIComponent(q)}`); if (r.ok) v = (await r.json()).v;
    } else {
      const key = getKey(); if (!key) return null;
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m.model}:embedContent`, {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({ content: { parts: [{ text: q }] }, taskType: "RETRIEVAL_QUERY", outputDimensionality: m.dim }) });
      if (r.ok) { const vals = (await r.json()).embedding.values; const n = Math.hypot(...vals) || 1; v = vals.map(x => x / n); }
      else if (r.status === 400 || r.status === 403) { keyBar("키가 맞지 않아요. 다시 입력해 주세요."); }
    }
  } catch (e) { v = null; }
  if (v) qvCache.set(q, v);
  return v;
}
function getKey() { try { return localStorage.getItem("gemini_key") || ""; } catch (e) { return ""; } }
function keyBar(msg) {      // 태블릿: 의미 검색용 키를 이 기기에만 저장 (NAS 파일에는 키가 없음)
  if (!STATIC_MODE || !DATA || !DATA.meta.embed) return;
  const key = getKey(), bar = $("keybar"); bar.hidden = false;
  bar.innerHTML = key && !msg
    ? `🧠 의미 검색 켜짐 <button id="keyBtn">키 바꾸기</button>`
    : `🔑 ${msg || "뜻으로 찾는 검색을 켜려면 Gemini API 키를 한 번 입력해 주세요 (이 기기에만 저장)."} <button id="keyBtn">키 입력</button>`;
  $("keyBtn").onclick = () => {
    const k = prompt("Gemini API 키 (AIza… 또는 AQ.…). 이 태블릿 브라우저에만 저장됩니다.", "");
    if (k === null) return;
    try { k.trim() ? localStorage.setItem("gemini_key", k.trim()) : localStorage.removeItem("gemini_key"); } catch (e) {}
    qvCache.clear(); keyBar(); aiButton(); search();
  };
}
// ── ③ AI 정밀 검색 ──
function aiAvail() { return !!(DATA && DATA.meta.ai && (DATA.meta.ai.rerank || (STATIC_MODE && getKey()))); }
function aiOn() { try { return aiAvail() && localStorage.getItem("ai_precise") === "1"; } catch (e) { return false; } }
function aiButton() {
  const b = $("aiBtn"); b.hidden = !aiAvail();
  b.classList.toggle("on", aiOn()); b.textContent = `🎯 AI 정밀 검색: ${aiOn() ? "켬" : "끔"}`;
}
$("aiBtn").onclick = () => {
  try { localStorage.setItem("ai_precise", aiOn() ? "0" : "1"); } catch (e) {}
  aiButton(); search();
};
function candText(p) {
  const its = p.items.map(it => `[${KINDS[it.kind] || it.kind}] ${it.title} ${String(it.description || "").slice(0, 80)}`).join(" / ");
  return `${p.file_name} ${p.page_no}쪽 | ${p.summary || ""} | 개념: ${(p.concepts || []).join(", ")} | ${its}`.slice(0, 400);
}
function rerankPrompt(q, cands) {   // app/rerank.py 와 같은 내용
  return "건축시공기술사 수험 자료에서 사용자가 찾는 페이지를 고르는 일이다. 질문의 뜻(문맥·의도)을 이해하고, "
    + "아래 후보 중 질문에 실제로 답이 되거나 직접 관련된 페이지 번호만 관련도가 높은 순서로 나열하라. "
    + "단어만 겹치고 주제가 다른 페이지는 빼라. JSON {\"order\":[번호...]}.\n"
    + `질문: ${q}\n후보:\n` + cands.map((c, i) => `[${i}] ${c}`).join("\n");
}
async function callRerank(q, texts) {
  const ai = DATA.meta.ai;
  if (ai.rerank) {
    const r = await fetch(ai.rerank, { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ q, cands: texts }) });
    return r.ok ? (await r.json()).order : null;
  }
  const key = getKey(); if (!key) return null;
  const gen = { responseMimeType: "application/json", temperature: 0.1, maxOutputTokens: 300,
    responseSchema: { type: "OBJECT", properties: { order: { type: "ARRAY", items: { type: "INTEGER" } } }, required: ["order"] },
    thinkingConfig: { thinkingLevel: "minimal" } };
  for (let t = 0; t < 2; t++) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${ai.model}:generateContent`, {
      method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ contents: [{ parts: [{ text: rerankPrompt(q, texts) }] }], generationConfig: gen }) });
    if (r.status === 400 && gen.thinkingConfig) { delete gen.thinkingConfig; continue; }
    if (!r.ok) return null;
    const parts = ((await r.json()).candidates || [{}])[0].content?.parts || [];
    const txt = parts.filter(x => !x.thought).map(x => x.text || "").join("");
    try { return JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1)).order; } catch (e) { return null; }
  }
  return null;
}
const rrCache = new Map();
async function aiRerank(q, results, my) {
  const cands = results.slice(0, 30);
  if (cands.length < 2) return null;
  const ck = `${q}|${state.kind}|${cands.map(p => p.page_key).join(",")}`;
  let order = rrCache.get(ck);
  if (!order) {
    const prev = $("count").innerHTML; $("count").innerHTML = prev + " · 🎯 AI가 고르는 중…";
    try { order = await callRerank(q, cands.map(candText)); } catch (e) { order = null; }
    if (my === seq && !order) $("count").innerHTML = prev + " · AI 정밀 검색 실패(일반 결과 표시)";
    if (!order) return null;
    order = order.filter(i => Number.isInteger(i) && i >= 0 && i < cands.length);
    rrCache.set(ck, order);
  }
  if (!order.length) return null;
  const picked = new Set(order.map(i => cands[i].page_key));
  return [...order.map(i => ({ ...cands[i], _ai: true, _weak: false })),
          ...results.filter(p => !picked.has(p.page_key)).map(p => ({ ...p, _ai: false, _weak: true }))];
}
function countKinds() {
  state.byKind = {};
  DATA.pages.forEach(p => p.items.forEach(it => state.byKind[it.kind] = (state.byKind[it.kind] || 0) + 1));
  renderChips();
}
let loading = false;
async function loadAll() {
  if (loading) return; loading = true;
  try {
    DATA = expandData(await fetch(STATIC_MODE ? "data.json" : "/api/data", { cache: "no-cache" }).then(r => r.json()));
    TEXT = {}; prepare(); countKinds();
    const head = `${DATA.meta.folder_name ? "📂 " + DATA.meta.folder_name + " · " : ""}시각자료 페이지 ${DATA.pages.length} · 업데이트 ${DATA.meta.exported_at}`;
    if (STATIC_MODE) $("status").textContent = head + " · 검색 준비 중…";
    search();
    const m = DATA.meta, jobs = [fetch(m.text || "text.json").then(r => r.json()).then(mergeText)];
    if (m.thesaurus) jobs.push(fetch(m.thesaurus).then(r => r.json()).then(buildThes));
    if (m.embed) jobs.push(fetch(m.embed.file).then(r => r.arrayBuffer()).then(b => { EMB = new Int8Array(b); EMB_DIM = m.embed.dim; }));
    else EMB = null;
    const res = await Promise.allSettled(jobs);
    prepare(); aiButton(); search(); keyBar();
    if (STATIC_MODE) $("status").textContent = head + (res[0].status === "rejected" ? " · 본문 검색 불가(그림 설명만 검색)" : "");
  } finally { loading = false; }
}
if (STATIC_MODE) {
  $("adminRow").querySelectorAll("input,button").forEach(el => el.remove());
  document.querySelector(".bar").remove();
} else poll();
loadAll();
</script>
