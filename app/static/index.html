<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive 시각자료 색인</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --accent-soft: #e8efff; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --panel: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
            --accent: #6d9bff; --accent-soft: #1e2a44; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  h1 { font-size: 17px; margin: 0 12px 0 0; }
  /* 검색 칸: 글이 길면 저절로 늘어나고(최대 6줄), 오른쪽 아래 모서리를 끌어 크기 조절 가능 */
  textarea#q { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--bg); color: var(--text); font: inherit; font-size: 15px; line-height: 1.4;
               resize: vertical; min-height: 40px; max-height: 60vh; overflow-y: auto; }
  input[type=text] { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
                     background: var(--bg); color: var(--text); font-size: 15px; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
           color: var(--text); cursor: pointer; font-size: 14px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; cursor: pointer;
          background: var(--panel); color: var(--muted); }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .status { font-size: 13px; color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: 1; min-width: 120px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
          cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .card:hover { border-color: var(--accent); }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; background: var(--bg); display: block; }
  .card .meta { padding: 8px 10px; font-size: 13px; display: grid; gap: 3px; }
  .card .file { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag.sem { background: transparent; border: 1px dashed var(--accent); }
  .tag.ai { background: #f59e0b; color: #1d2330; }
  #aiBtn.on { background: #f59e0b; color: #1d2330; border-color: #f59e0b; }
  .concepts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #keybar button { padding: 3px 10px; font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft);
         color: var(--accent); margin-right: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; }
  /* viewer */
  /* 보기 화면: 그림을 화면 가득, 위쪽 얇은 막대에 넘기기·원본 열기만 */
  .viewer { position: fixed; inset: 0; background: #111; z-index: 20; display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .vbar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #000; }
  .vbar button, .vbar .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #333; background: #1d1f23;
                             color: #eee; font-size: 15px; text-decoration: none; white-space: nowrap; }
  .vbar .btn[hidden] { display: none; }
  .vinfo { flex: 1; min-width: 0; color: #aaa; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .stage { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; }
  .stage img, .stage canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; display: block; }
  .stage canvas[hidden], .stage img[hidden] { display: none; }
  .side { position: absolute; right: 0; top: 50px; bottom: 0; width: min(380px, 92vw); background: var(--panel);
          overflow: auto; padding: 16px; display: grid; gap: 12px; align-content: start; box-shadow: -4px 0 20px rgba(0,0,0,.5); }
  .side[hidden] { display: none; }
  /* 그림 양옆의 큰 넘기기 버튼 (태블릿에서 누르기 쉽게) */
  .edge { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 96px; border: 0; border-radius: 12px;
          background: rgba(0,0,0,.35); color: #fff; font-size: 44px; line-height: 1; cursor: pointer; }
  .edge.left { left: 6px; } .edge.right { right: 6px; }
  .edge:active { background: rgba(0,0,0,.6); }
  .side h2 { font-size: 16px; margin: 0; word-break: break-all; }
  .item { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
  .item .desc { color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
  .kw { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .timing { font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <div class="row" id="adminRow">
    <h1>📁 Drive 시각자료 색인</h1>
    <input id="folder" type="text" placeholder="Drive 폴더 URL, 또는 내 PC 폴더 경로 (예: G:\내 드라이브\건축시공기술사)">
    <button id="btnIndex" class="primary">색인 시작</button>
    <button id="btnExport" title=".env의 EXPORT_DIR(NAS 폴더)로 보기 전용 사이트를 내보냅니다">NAS로 내보내기</button>
  </div>
  <div class="row">
    <div class="bar"><div id="bar"></div></div>
    <span class="status" id="status">불러오는 중…</span>
  </div>
  <div class="row">
    <textarea id="q" rows="1" placeholder="검색: 예) 기온에 따른 강도, 타설 스피드, jsp, 필기한 단어"></textarea>
    <button id="camBtn" hidden title="문제를 찍거나 사진을 고르면 AI가 문제를 읽고 관련 자료를 찾아 줌 (1번에 약 2원)">📷 문제로 검색</button>
    <input id="camInput" type="file" accept="image/*" hidden>
    <button id="installBtn" hidden title="태블릿에 앱으로 설치하면 어느 화면에서든 '공유 → 시각자료 색인'으로 검색">📲 앱으로 설치</button>
    <button id="aiBtn" hidden title="상위 결과를 AI가 질문의 뜻에 맞게 다시 골라 줌 (검색 1번에 약 1원)">🎯 AI 정밀 검색: 끔</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="status" id="keybar" hidden></div>
</header>
<main>
  <div class="status" id="count" style="margin:0 0 10px"></div>
  <div class="grid" id="grid"></div>
  <button id="more" hidden style="display:block;margin:16px auto">더 보기</button>
  <div class="empty" id="empty" hidden>결과가 없습니다.</div>
</main>

<div class="viewer" id="viewer">
  <div class="vbar">
    <button id="prev" title="이전 검색 결과 (Shift+←)">← 이전 결과</button><button id="next" title="다음 검색 결과 (Shift+→)">다음 결과 →</button>
    <span class="vinfo" id="vsub"></span>
    <a id="vorig" class="btn" target="_blank" rel="noopener">원본 열기 ↗</a>
    <button id="vinfoBtn" title="AI 설명 보기">ⓘ</button>
    <button id="close" title="닫기 (Esc)">✕</button>
  </div>
  <div class="stage" id="stage"><img id="vimg" alt=""><canvas id="vcanvas" hidden></canvas></div>
  <button class="edge left" id="prev2" aria-label="같은 책 앞 쪽" title="같은 책 앞 쪽 (←)">‹</button>
  <button class="edge right" id="next2" aria-label="같은 책 뒤 쪽" title="같은 책 뒤 쪽 (→)">›</button>
  <aside class="side" id="side" hidden>
    <h2 id="vtitle"></h2>
    <div class="timing" id="vtime"></div>
    <div id="vitems"></div>
  </aside>
</div>

<script>
const STATIC_MODE = false;   // 내보내기(NAS) 버전에서는 true 로 바뀜 → 서버 없이 브라우저에서 검색
const KINDS = { "": "전체", figure: "그림", table: "표", flowchart: "플로우차트", chart: "차트",
                diagram: "다이어그램", photo: "사진", screenshot: "스크린샷", handwriting: "필기" };
const $ = id => document.getElementById(id);
let state = { q: "", kind: "", results: [], cur: -1, byKind: {} };
const prefetched = new Set();

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderChips() {
  const total = Object.values(state.byKind).reduce((a, b) => a + b, 0);
  $("chips").innerHTML = Object.entries(KINDS).map(([k, label]) => {
    const n = k ? (state.byKind[k] || 0) : total;
    if (k && !n) return "";
    return `<span class="chip ${state.kind === k ? "on" : ""}" data-k="${k}">${label} ${n}</span>`;
  }).join("");
}
$("chips").onclick = e => { const k = e.target.dataset.k; if (k === undefined) return; state.kind = k; renderChips(); search(); };

let timer, seq = 0;
// 검색 칸 높이를 내용에 맞춤 (사용자가 모서리로 직접 늘린 높이는 존중)
let qManual = false;
function fitQ() {
  const t = $("q"); if (qManual) return;
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight + 2, parseFloat(getComputedStyle(t).lineHeight) * 6 + 22) + "px";
}
$("q").addEventListener("mousedown", e => {        // 모서리를 잡고 끄는 경우
  const r = $("q").getBoundingClientRect(); if (e.clientX > r.right - 20 && e.clientY > r.bottom - 20) qManual = true;
});
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); clearTimeout(timer); state.q = $("q").value.trim(); search(); } });
$("q").addEventListener("input", fitQ);
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(() => { state.q = $("q").value.trim(); search(); }, 150); };

const PAGE_CHUNK = 120;          // 결과 카드는 120개씩 나눠 그림 → 결과가 수천 개여도 바로 뜸
const imgUrl = (dir, p) => `img/${dir}/${p.page_key}.webp?v=${p.v || ""}`;
function cardHtml(p, i) {
  const first = p.items[0] || {};
  const tags = [...new Set(p.items.map(it => KINDS[it.kind] || it.kind))].map(t => `<span class="tag">${esc(t)}</span>`).join("")
    + (p._sem ? `<span class="tag sem" title="단어는 다르지만 뜻이 비슷한 결과">뜻 비슷</span>` : "")
    + (p._ai ? `<span class="tag ai" title="AI가 질문의 뜻에 맞다고 고른 결과">AI 추천</span>` : "")
    + (p._exact ? `<span class="tag ai" style="background:#16a34a;color:#fff" title="입력한 문장이 그대로 들어 있음">정확히 일치</span>` : "");
  return `<div class="card" data-i="${i}">
    <img loading="lazy" src="${imgUrl("thumbs", p)}" alt="">
    <div class="meta"><div>${tags}</div>
      <div class="title">${esc(first.title || first.description || "")}</div>
      <div class="file">${esc(p.file_name)} · ${p.page_no}p</div></div></div>`;
}
let shown = 0;
function renderMore() {
  const next = state.results.slice(shown, shown + PAGE_CHUNK);
  $("grid").insertAdjacentHTML("beforeend", next.map((p, k) => cardHtml(p, shown + k)).join(""));
  shown += next.length;
  $("more").hidden = shown >= state.results.length;
  $("more").textContent = `더 보기 (${state.results.length - shown}개 남음)`;
}
function search() {
  const my = ++seq;
  if (!DATA) return;
  showResults(rank(state.q, state.kind, null));          // 1) 글자·동의어 검색 → 즉시 표시
  clearTimeout(semTimer);
  if (!state.q || (!EMB && !aiOn())) return;
  semTimer = setTimeout(async () => {                     // 입력이 멈추면
    let res = null;
    if (EMB) {                                            // 2) 의미 검색을 더해 다시 정렬
      const qv = await queryVector(state.q);
      if (my !== seq) return;
      if (qv) { res = rank(state.q, state.kind, qv); showResults(res); }
    }
    if (aiOn()) {                                         // 3) AI 정밀 검색: 상위 후보를 AI가 뜻에 맞게 다시 고름
      const rr = await aiRerank(state.q, res || rank(state.q, state.kind, null), my);
      if (rr && my === seq) showResults(rr);
    }
  }, 600);
}
let weakShown = false, lastAll = [];
function showResults(results, keepWeak) {
  lastAll = results;
  if (!keepWeak) weakShown = false;
  const strong = results.filter(p => !p._weak), weak = results.length - strong.length;
  state.results = weakShown ? results : strong;
  $("empty").hidden = results.length > 0;
  const sem = state.results.filter(p => p._sem).length, ai = results.filter(p => p._ai).length,
        exa = results.filter(p => p._exact).length;
  $("count").innerHTML = !state.q ? (results.length ? `전체 ${results.length}쪽` : "") : results.length
    ? (exa ? `✅ 정확히 일치 ${exa}쪽 · ` : "")
      + (ai ? `🎯 AI가 고른 결과 ${ai}쪽` : `관련 높은 결과 ${strong.length - exa}쪽${sem ? ` (뜻이 비슷한 결과 ${sem}쪽 포함)` : ""}`)
      + (weak ? ` · <a href="#" id="weakLink">${weakShown ? "관련도 낮은 결과 숨기기" : `관련도 낮은 결과 ${weak}쪽 더 보기`}</a>` : "")
    : "";
  const wl = document.getElementById("weakLink");
  if (wl) wl.onclick = e => { e.preventDefault(); weakShown = !weakShown; showResults(lastAll, true); };
  $("grid").innerHTML = ""; shown = 0;
  renderMore();
}
let semTimer;

// 스크롤이 끝에 가까워지면 자동으로 다음 묶음을 그림
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < state.results.length) renderMore(); },
                         { rootMargin: "800px" }).observe($("more"));
$("more").onclick = renderMore;

// 마우스를 올리면 전체 페이지 이미지를 미리 받아둠 → 클릭 시 즉시 표시
function prefetch(i) {
  const p = state.results[i]; if (!p || prefetched.has(p.page_key)) return;
  prefetched.add(p.page_key); const im = new Image(); im.src = imgUrl("pages", p);
}
$("grid").addEventListener("mouseover", e => { const c = e.target.closest(".card"); if (c) prefetch(+c.dataset.i); });
$("grid").addEventListener("touchstart", e => { const c = e.target.closest(".card"); if (c) prefetch(+c.dataset.i); }, { passive: true });
$("grid").onclick = e => { const c = e.target.closest(".card"); if (c) openViewer(+c.dataset.i); };

function openViewer(i) {
  const p = state.results[i]; if (!p) return;
  state.cur = i; doc.p = p; doc.page = p.page_no;
  const t0 = performance.now();
  const img = $("vimg"); img.hidden = false; $("vcanvas").hidden = true;
  img.src = imgUrl("thumbs", p);                       // 캐시된 썸네일을 먼저 보여주고
  const full = new Image();
  full.onload = () => { if (state.cur === i) { img.src = full.src;
    $("vtime").textContent = `페이지 표시: ${((performance.now() - t0) / 1000).toFixed(2)}초`; } };
  full.src = imgUrl("pages", p);                       // 고해상도로 교체
  $("vtitle").textContent = p.file_name;
  $("vsub").textContent = `${p.file_name} · ${p.page_no} / ${p.page_count}쪽`;
  edgeState();
  // 원본 열기: NAS(또는 PC)에 복사된 원본 PDF를 해당 쪽으로. 없으면 Google Drive 링크
  const o = $("vorig"), base = STATIC_MODE ? "files/" : "/files/";
  if (p.orig) {
    const url = base + p.orig;
    o.href = /\.pdf$/i.test(p.orig)
      ? `pdf.html?${new URLSearchParams({ src: url, page: p.page_no, name: p.file_name })}` : url;
    o.hidden = false;
  } else if (p.web_link) { o.href = p.web_link; o.hidden = false; }
  else o.hidden = true;
  $("vitems").innerHTML = (p.summary ? `<div class="item"><b>📌 ${esc(p.summary)}</b>
       <div class="concepts">${(p.concepts || []).map(c => `<span class="tag">${esc(c)}</span>`).join("")}</div>
       ${(p.questions || []).map(q => `<div class="kw">❓ ${esc(q)}</div>`).join("")}</div>` : "")
    + p.items.map(it => `<div class="item"><span class="tag">${esc(KINDS[it.kind] || it.kind)}</span>
     <b>${esc(it.title)}</b><div class="desc">${esc(it.description)}</div>
     ${it.keywords ? `<div class="kw"># ${esc(it.keywords)}</div>` : ""}
     <div class="kw">분석: ${esc(it.source)}</div></div>`).join("");
  $("viewer").classList.add("open");
  $("stage").scrollTop = 0;
  prefetch(i + 1); prefetch(i - 1);
}
function closeViewer() { $("viewer").classList.remove("open"); state.cur = -1; }
$("close").onclick = closeViewer;
$("prev").onclick = () => openViewer(state.cur - 1);
$("next").onclick = () => openViewer(state.cur + 1);
$("prev2").onclick = () => showDocPage(doc.page - 1);
$("next2").onclick = () => showDocPage(doc.page + 1);
// ── 같은 책(PDF)의 앞뒤 쪽 넘기기: 색인된 쪽은 미리 만든 이미지, 아닌 쪽은 원본 PDF에서 그 쪽만 받아 그림 ──
const doc = { p: null, page: 0, pdfs: new Map(), busy: 0 };
function fileIdOf(p) { return p.page_key.slice(0, p.page_key.lastIndexOf("_")); }
function edgeState() {
  const p = doc.p; if (!p) return;
  const canPdf = p.orig && /\.pdf$/i.test(p.orig);
  $("prev2").disabled = doc.page <= 1 || (!canPdf && !pageImg(p, doc.page - 1));
  $("next2").disabled = doc.page >= p.page_count || (!canPdf && !pageImg(p, doc.page + 1));
  $("prev2").style.opacity = $("prev2").disabled ? .25 : 1; $("next2").style.opacity = $("next2").disabled ? .25 : 1;
}
let pageIndex = null;
function pageImg(p, n) {
  if (!pageIndex) { pageIndex = new Map(); DATA.pages.forEach(x => pageIndex.set(x.page_key, x)); }
  return pageIndex.get(`${fileIdOf(p)}_${n}`);
}
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "pdfjs/pdf.min.js";
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "pdfjs/pdf.worker.min.js"; ok(); }; sc.onerror = bad; document.head.append(sc); });
}
async function showDocPage(n) {
  const p = doc.p; if (!p || n < 1 || n > p.page_count) return;
  doc.page = n; const my = ++doc.busy;
  const label = `${p.file_name} · ${n} / ${p.page_count}쪽`;
  $("vsub").textContent = label + (n === p.page_no ? "" : "  (검색 결과 쪽: " + p.page_no + ")");
  edgeState(); $("stage").scrollTop = 0;
  const known = pageImg(p, n), img = $("vimg"), cv = $("vcanvas");
  if (known) {                                            // 색인된 쪽: 이미지로 즉시

  const its = p.items.map(it => `[${KINDS[it.kind] || it.kind}] ${it.title} ${String(it.description || "").slice(0, 80)}`).join(" / ");
  return `${p.file_name} ${p.page_no}쪽 | ${p.summary || ""} | 개념: ${(p.concepts || []).join(", ")} | ${its}`.slice(0, 400);
}
function rerankPrompt(q, cands) {   // app/rerank.py 와 같은 내용
  return "건축시공기술사 수험 자료에서 사용자가 찾는 페이지를 고르는 일이다. 질문의 뜻(문맥·의도)을 이해하고, "
    + "아래 후보 중 질문에 실제로 답이 되거나 직접 관련된 페이지 번호만 관련도가 높은 순서로 나열하라. "
    + "단어만 겹치고 주제가 다른 페이지는 빼라. JSON {\"order\":[번호...]}.\n"
    + `질문: ${q}\n후보:\n` + cands.map((c, i) => `[${i}] ${c}`).join("\n");
}
let rrError = "";
// 한 모델이 사용 한도(429)·없음(404)·과부하(503)면 같은 계열의 다른 모델로 바꿔 시도 (모델마다 한도가 따로)
async function rerankModels(key, first) {
  let saved = ""; try { saved = localStorage.getItem("rr_model") || ""; } catch (e) {}
  const list = [saved, first].filter(Boolean);
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", { headers: { "x-goog-api-key": key } });
    if (r.ok) {
      const names = ((await r.json()).models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
        .map(m => m.name.replace(/^models\//, ""))
        .filter(n => /^gemini-[\d.]+-flash(-lite)?(-latest|-\d+)?$/.test(n));
      const ver = n => parseFloat((n.match(/gemini-([\d.]+)/) || [0, 0])[1]);
      const lite = names.filter(n => n.includes("lite")).sort((a, b) => ver(b) - ver(a));
      const flash = names.filter(n => !n.includes("lite")).sort((a, b) => ver(b) - ver(a));
      list.push(...lite, ...flash);
    }
  } catch (e) {}
  return [...new Set(list)].slice(0, 4);
}
async function callRerank(q, texts) {
  const ai = DATA.meta.ai; rrError = "";
  if (ai.rerank) {
    const r = await fetch(ai.rerank, { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ q, cands: texts }) });
    if (!r.ok) { try { rrError = (await r.json()).detail || ""; } catch (e) {} return null; }
    return (await r.json()).order;
  }
  const key = getKey(); if (!key) return null;
  const body = gen => JSON.stringify({ contents: [{ parts: [{ text: rerankPrompt(q, texts) }] }], generationConfig: gen });
  for (const model of await rerankModels(key, ai.model)) {
    const gen = { responseMimeType: "application/json", temperature: 0.1, maxOutputTokens: 300,
      responseSchema: { type: "OBJECT", properties: { order: { type: "ARRAY", items: { type: "INTEGER" } } }, required: ["order"] },
      thinkingConfig: { thinkingLevel: "minimal" } };
    for (let t = 0; t < 2; t++) {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: body(gen) });
      if (r.status === 400 && gen.thinkingConfig) { delete gen.thinkingConfig; continue; }
      if (!r.ok) {
        rrError = { 429: "사용 한도 초과", 404: "모델 없음", 503: "서버 바쁨", 403: "키 권한 없음", 402: "결제 확인 필요" }[r.status]
                  || `오류 ${r.status}`;
        break;                                            // 다음 모델로
      }
      const parts = ((await r.json()).candidates || [{}])[0].content?.parts || [];
      const txt = parts.filter(x => !x.thought).map(x => x.text || "").join("");
      try {
        const order = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1)).order;
        try { localStorage.setItem("rr_model", model); } catch (e) {}
        return order;
      } catch (e) { rrError = "응답 형식 오류"; break; }
    }
  }
  return null;
}
// ── 📷 문제로 검색: 사진 속 문제를 AI가 읽고 → 검색창에 넣어 바로 검색 ──
const PHOTO_PROMPT = "이미지는 건축시공기술사 시험 문제, 교재·필기의 일부, 또는 도면·그림·사진이다. JSON으로 답하라. "
  + "문제나 제목 글이 있으면 question: 그 문장을 쓰인 그대로(번호·배점 제외, 80자 이내). "
  + "글이 거의 없는 그림·도면·사진이면 question: 그림이 무엇을 나타내는지 건설 용어로 한 문장(예: '흙막이 벽체 단면과 지하수위'). "
  + "query: 이 문제나 그림과 관련된 자료를 찾기 위한 핵심 주제 구절(30자 이내). keywords: 핵심어 3~6개(공법·부재·현상 이름). "
  + "건설과 무관하거나 알아볼 수 없으면 question을 빈 문자열로.";   // app/photo.py 와 같은 내용
function shrinkImage(file, max = 1280) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = bad; img.src = url;
  });
}
async function readQuestion(b64) {
  const ai = DATA.meta.ai;
  if (ai.photo) {
    const r = await fetch(ai.photo, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: b64 }) });
    if (!r.ok) { let d = ""; try { d = (await r.json()).detail; } catch (e) {} throw new Error(d || `오류 ${r.status}`); }
    return r.json();
  }
  const key = getKey(); if (!key) throw new Error("키 없음");
  let why = "";
  for (const model of await rerankModels(key, ai.model)) {
    const gen = { responseMimeType: "application/json", temperature: 0.1, maxOutputTokens: 400,
      responseSchema: { type: "OBJECT", properties: { question: { type: "STRING" }, query: { type: "STRING" },
        keywords: { type: "ARRAY", items: { type: "STRING" } } }, required: ["question", "query", "keywords"] },
      thinkingConfig: { thinkingLevel: "minimal" } };
    for (let t = 0; t < 2; t++) {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({ contents: [{ parts: [{ inline_data: { mime_type: "image/jpeg", data: b64 } }, { text: PHOTO_PROMPT }] }],
                               generationConfig: gen }) });
      if (r.status === 400 && gen.thinkingConfig) { delete gen.thinkingConfig; continue; }
      if (!r.ok) { why = { 429: "사용 한도 초과", 402: "결제 확인 필요", 403: "키 권한 없음" }[r.status] || `오류 ${r.status}`; break; }
      const parts = ((await r.json()).candidates || [{}])[0].content?.parts || [];
      const txt = parts.filter(x => !x.thought).map(x => x.text || "").join("");
      return JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
    }
  }
  throw new Error(why || "사진을 읽지 못함");
}

$("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").hidden = true; };

}
// ── 다른 앱에서 '공유 → 시각자료 색인'으로 받은 글자·사진 처리 (sw.js가 넘겨 줌) ──
async function handleShare() {
  const P = new URLSearchParams(location.search), kind = P.get("share");
  if (!kind) return;
  history.replaceState(null, "", location.pathname);           // 새로고침해도 다시 실행되지 않게
  if (kind === "image") {
    try {
      const box = await caches.open("share-inbox"), r = await box.match("shared-image");
      if (r) { const blob = await r.blob(); await box.delete("shared-image"); return searchByImage(blob); }
    } catch (e) {}
  }
  const t = (P.get("text") || "").replace(/https?:\/\/\S+/g, "").trim();
  if (t) { $("q").value = t; state.q = t; qManual = false; fitQ(); search(); }
}

let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
const rrCache = new Map();
async function aiRerank(q, results, my) {
  const cands = results.filter(p => !p._exact).slice(0, 30);
  if (cands.length < 2) return null;
  const ck = `${q}|${state.kind}|${cands.map(p => p.page_key).join(",")}`;
  let order = rrCache.get(ck);
  if (!order) {
    const prev = $("count").innerHTML; $("count").innerHTML = prev + " · 🎯 AI가 고르는 중…";
    try { order = await callRerank(q, cands.map(candText)); } catch (e) { order = null; }
    if (my === seq && !order) $("count").innerHTML = prev + ` · AI 정밀 검색 실패${rrError ? `: ${esc(rrError)}` : ""} (일반 결과 표시)`;
    if (!order) return null;
    order = order.filter(i => Number.isInteger(i) && i >= 0 && i < cands.length);
    rrCache.set(ck, order);
  }
  const exact = results.filter(p => p._exact);                     // '정확히 일치'는 AI와 상관없이 맨 위 고정
  const ex = new Set(exact.map(p => p.page_key));
  order = order.filter(i => !ex.has(cands[i].page_key));
  if (!order.length && !exact.length) return null;
  const picked = new Set(order.map(i => cands[i].page_key));
  return [...exact.map(p => ({ ...p, _weak: false })),
          ...order.map(i => ({ ...cands[i], _ai: true, _weak: false })),
          ...results.filter(p => !picked.has(p.page_key) && !ex.has(p.page_key)).map(p => ({ ...p, _ai: false, _weak: true }))];
}
function countKinds() {

}

    const res = await Promise.allSettled(jobs);

  } finally { loading = false; }
}
